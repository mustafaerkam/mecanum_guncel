ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom          # KRITIK: local EKF world_frame = odom_frame -> yalniz odom->base_footprint yayinlar

    odom0: wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    # Manyetometre tabanli mutlak yaw KULLANILMIYOR (olculmedi, gorev kurali).
    # Yaw yalniz BNO055/sim IMU'nun gyro Z'sinden (imu0_config twist.angular.z) geliyor.

    print_diagnostics: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
