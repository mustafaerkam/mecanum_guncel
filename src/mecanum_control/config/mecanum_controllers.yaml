# Ortak controller_manager + controller konfigurasyonu — sim ve gercekte AYNI.
# Yalniz <ros2_control><hardware><plugin> (sim: gz_ros2_control/GazeboSimSystem,
# gercek: mecanum_control/MecanumSystemInterface) degisir.
#
# Parametre isimleri /opt/ros/humble/lib/libmecanum_drive_controller.so uzerinde
# `strings` ile DOGRULANDI (headless testte "rear_right_wheel_command_joint_name
# cannot be empty" hatasiyla "back_*" isimlerinin yanlis oldugu, dogrusunun
# "rear_*" oldugu bulundu; odom_only_twist ve publish_rate BU CONTROLLERDA
# YOK, kaldirildi).

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz — Pi 5 CPU butcesiyle E asamasinda olculup revize edilecek
    # use_sim_time BURADA TANIMLANMAZ: bu dosya GERCEK robot profilidir ve
    # gercekte /clock yayinlayan kimse yoktur. Deger launch'tan gecirilir
    # (real_nav.launch.py -> false). YAML'a 'true' yazilirsa controller'lar
    # /clock bekleyip takilir ve teker komutu HIC uretilmez.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: "wheel_fl_joint"
    front_right_wheel_command_joint_name: "wheel_fr_joint"
    rear_left_wheel_command_joint_name: "wheel_rl_joint"
    rear_right_wheel_command_joint_name: "wheel_rr_joint"

    front_left_wheel_state_joint_name: "wheel_fl_joint"
    front_right_wheel_state_joint_name: "wheel_fr_joint"
    rear_left_wheel_state_joint_name: "wheel_rl_joint"
    rear_right_wheel_state_joint_name: "wheel_rr_joint"

    # Gercek arac geometrisi URDF'den (mecanum_robot.xacro).
    # Gercek robotta olculmeden kullanilmayacak.
    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.1625
      # URDF wheel joint origins: lx=0.40, ly=0.54. This value must track the
      # collision/kinematic model, not an older chassis estimate.
      sum_of_robot_center_projection_on_X_Y_axis: 0.94

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    enable_odom_tf: false      # KRITIK: odom->base_footprint tek sahibi EKF'dir, controller yayinlamaz

    use_stamped_vel: false
    reference_timeout: 0.5     # s — MPPI/teleop komut frekansi >=10 Hz

    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
