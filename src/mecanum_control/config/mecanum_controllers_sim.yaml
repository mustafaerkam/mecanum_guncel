# Gazebo Fortress contact-model calibration.  The public controller, topic and
# TF contracts are identical to mecanum_controllers.yaml (real/HIL profile).
# Controller slots follow the URDF's FL/FR/RL/RR joint names exactly.  Any
# contact-model correction must live in a simulation-only layer, never in a
# controller joint permutation or the real-vehicle URDF. Real motor/encoder
# mapping remains OPEN #3.
controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

mecanum_drive_controller:
  ros__parameters:
    use_sim_time: true

    front_left_wheel_command_joint_name: "wheel_fl_joint"
    front_right_wheel_command_joint_name: "wheel_fr_joint"
    rear_left_wheel_command_joint_name: "wheel_rl_joint"
    rear_right_wheel_command_joint_name: "wheel_rr_joint"
    front_left_wheel_state_joint_name: "wheel_fl_joint"
    front_right_wheel_state_joint_name: "wheel_fr_joint"
    rear_left_wheel_state_joint_name: "wheel_rl_joint"
    rear_right_wheel_state_joint_name: "wheel_rr_joint"

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.1625
      sum_of_robot_center_projection_on_X_Y_axis: 0.94
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    enable_odom_tf: false
    use_stamped_vel: false
    reference_timeout: 0.5
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
